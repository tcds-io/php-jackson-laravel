name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP CS Fixer
        run: composer cs:check

      - name: PHPStan
        run: composer test:stan

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: [ '^12.0', '^13.0' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup testing application
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: tests/install.sh

      - name: Run tests
        run: cd tests/blog && php artisan test
